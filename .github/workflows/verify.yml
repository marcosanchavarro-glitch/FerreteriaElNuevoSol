name: Verify demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ens_test
          POSTGRES_USER: ens_test
          POSTGRES_PASSWORD: ephemeral-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ens_test -d ens_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, intl, mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, zip
          coverage: none
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test --compact --display-warnings
        env:
          APP_KEY: base64:dGVzdGluZy1vbmx5LTAxMjM0NTY3ODlhYmNkZWYwMTI=
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'ens_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USERNAME: ens_test
          DB_PASSWORD: ephemeral-test-only
          DB_SSLMODE: disable
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t ens-demo ./backend
      - name: Verify Apache and static assets in the production image
        run: |
          docker run --rm --entrypoint sh ens-demo -c 'test ! -f .env && test ! -f .env.demo-secrets && test ! -f database/database.sqlite'
          docker run -d --name ens-http -p 18080:10000 \
            -e PORT=10000 -e APP_ENV=production -e APP_DEBUG=false \
            -e APP_URL=https://demo.example.test \
            -e APP_KEY=base64:dGVzdGluZy1vbmx5LTAxMjM0NTY3ODlhYmNkZWYwMTI= \
            --entrypoint apache2-foreground ens-demo
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/up
          curl --fail --output /dev/null http://127.0.0.1:18080/css/branding.css
          docker stop ens-http
      - name: Validate Render Blueprint against official schema
        run: |
          python -m pip install --quiet PyYAML jsonschema
          python - <<'PY'
          import json, urllib.request, yaml, jsonschema
          with urllib.request.urlopen('https://render.com/schema/render.yaml.json') as response:
              schema = json.load(response)
          with open('render.yaml', encoding='utf-8') as source:
              blueprint = yaml.safe_load(source)
          jsonschema.validate(blueprint, schema)
          print('Blueprint valid')
          PY
