name: Verify demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ens_test
          POSTGRES_USER: ens_test
          POSTGRES_PASSWORD: ephemeral-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: gd, intl, mbstring, pdo_sqlite, pdo_pgsql, pdo_mysql, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test --compact
        env:
          APP_KEY: base64:dGVzdGluZy1vbmx5LTAxMjM0NTY3ODlhYmNkZWYwMTI=
          DB_CONNECTION: ${{ matrix.database }}
          DB_DATABASE: ${{ matrix.database == 'pgsql' && 'ens_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USERNAME: ens_test
          DB_PASSWORD: ephemeral-test-only
          DB_SSLMODE: disable
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t ens-demo ./backend
